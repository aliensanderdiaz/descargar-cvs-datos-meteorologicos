<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brillo Solar V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px
        }

        .controles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px
        }

        button {
            padding: 10px 14px;
            border: none;
            background: #1976d2;
            color: #fff;
            border-radius: 4px;
            cursor: pointer
        }

        .table-wrap {
            overflow: auto;
            background: #fff;
            border: 1px solid #ccc
        }

        table {
            border-collapse: collapse
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 2px;
            text-align: center
        }

        th {
            background: #1976d2;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 3
        }

        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            background: #1976d2;
            color: #fff;
            z-index: 2;
            min-width: 70px
        }

        input {
            width: 60px;
            border: none;
            text-align: center;
            padding: 5px
        }

        input:focus {
            outline: 2px solid #1976d2;
            background: #ffd54f
        }

        .fila-activa td {
            background: #fff8c4 !important
        }

        .columna-activa {
            background: #fff8c4 !important
        }

        .celda-activa {
            background: #ffd54f !important
        }

        .total-dia {
            font-weight: bold;
            background: #e8f5e9;
            color: #1b5e20
        }

        #filaTotales td {
            border-top: 3px solid #1976d2
        }
    </style>
</head>

<body>
    <h2>Heliógrafo - Brillo Solar V2</h2>
    <div class="controles">
        <label>Mes <input id="mes" type="number" min="1" max="12" value="8"></label>
        <label>Año <input id="anio" type="number" value="2026"></label>
        <button onclick="crearTabla()">Generar Tabla</button>
        <button onclick="descargarCSV()">Descargar CSV</button>
    </div>
    <div class="table-wrap">
        <table id="tabla"></table>
    </div>
    <script>
        const HORAS = ['05:00', '06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'];
        const pad = n => String(n).padStart(2, '0');
        const diasMes = (a, m) => new Date(a, m, 0).getDate();
        function crearTabla() {
            const mes = +document.getElementById('mes').value; const anio = +document.getElementById('anio').value; const dias = diasMes(anio, mes);
            let html = '<tr><th>Hora</th>';
            for (let d = 1; d <= dias; d++) html += `<th id="head-${d}">${pad(d)}</th>`;
            html += '</tr>';
            HORAS.forEach((hora, row) => {
                html += `<tr><td id="hora-${row}">${hora}</td>`;
                for (let dia = 1; dia <= dias; dia++) {
                    html += `<td><input value="0" data-row="${row}" data-col="${dia}"></td>`;
                }
                html += '</tr>';
            });
            html += '<tr id="filaTotales"><td><b>TOTAL</b></td>';
            for (let dia = 1; dia <= dias; dia++) html += `<td id="total-dia-${dia}" class="total-dia">0.0</td>`;
            html += '</tr>';

            document.getElementById('tabla').innerHTML = html;
            configurar();
            recalcularTotales();
        }
        function recalcularTotales() {
            const dias = document.querySelectorAll('[id^="total-dia-"]').length;
            for (let d = 1; d <= dias; d++) {
                let total = 0;
                document.querySelectorAll(`input[data-col="${d}"]`).forEach(i => total += parseFloat(i.value) || 0);
                document.getElementById(`total-dia-${d}`).textContent = total.toFixed(1);
            }
        }
        function limpiarResaltado() {
            document.querySelectorAll('.fila-activa').forEach(x => x.classList.remove('fila-activa'));
            document.querySelectorAll('.columna-activa').forEach(x => x.classList.remove('columna-activa'));
            document.querySelectorAll('.celda-activa').forEach(x => x.classList.remove('celda-activa'));
        }
        function configurar() {
            document.querySelectorAll('input[data-row]').forEach(input => {
                input.addEventListener('input', recalcularTotales);
                input.addEventListener('focus', () => {
                    limpiarResaltado();
                    input.select();
                    const row = +input.dataset.row, col = +input.dataset.col;
                    input.classList.add('celda-activa');
                    input.closest('tr').classList.add('fila-activa');
                    document.querySelectorAll(`input[data-col="${col}"]`).forEach(c => c.parentElement.classList.add('columna-activa'));
                    document.getElementById('head-' + col)?.classList.add('columna-activa');
                    document.getElementById('hora-' + row)?.classList.add('columna-activa');
                });
                input.addEventListener('keydown', e => {
                    if (e.key !== 'Enter') return;
                    e.preventDefault();
                    const row = +input.dataset.row, col = +input.dataset.col;
                    let sig = document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
                    if (!sig) sig = document.querySelector(`input[data-row="0"][data-col="${col + 1}"]`);
                    if (sig) { sig.focus(); sig.select(); }
                });
            });
        }
        function descargarCSV() {
            const mes = +document.getElementById('mes').value; const anio = +document.getElementById('anio').value; const dias = diasMes(anio, mes);
            let csv = 'Dia;brillo';
            for (let dia = 1; dia <= dias; dia++) {
                HORAS.forEach((hora, row) => {
                    const v = document.querySelector(`input[data-row="${row}"][data-col="${dia}"]`).value || 0;
                    csv += `${pad(dia)}/${pad(mes)}/${anio} ${hora};${v}
`;
                });
            }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `brillo_v2_${anio}_${pad(mes)}.csv`;
            a.click();
        }
        crearTabla();
    </script>
</body>

</html>
